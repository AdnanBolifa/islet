name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # only used to publish releases on tags
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build Islet.app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/bundle.sh
          ditto -c -k --keepParent build/Islet.app build/Islet.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Islet
          path: build/Islet.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download **Islet.zip**, unzip it and move **Islet.app** to your Applications folder.
          2. This build isn't notarized yet, so macOS blocks the first launch. Run this once in Terminal:
             ```
             xattr -dr com.apple.quarantine /Applications/Islet.app
             ```
          3. Open Islet. It lives in the menu bar and at the notch.

          Requires macOS 14 or later. Universal (Apple Silicon and Intel).
          EOF
          gh release create "$GITHUB_REF_NAME" build/Islet.zip --title "Islet $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
